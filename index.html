<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=DM+Mono:wght@400&family=Noto+Serif+JP:wght@400;600&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a near-empty page — wordmark + one link up top, one GIF in the middle; the blog is a single narrow column. */
:root {
  --bg: #f5f6f7;
  --ink: #1e2024;
  --muted: #868b93;
  --line: #e2e4e8;
  --pink: #f2a7bd;
  --sky: #a9cbe8;
  --leaf: #9fcf9a;
  --display: "Fraunces", Georgia, serif;
  --body: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --ink: #e9eaec; --muted: #7d828a; --line: #2a2d32;
    --pink: #d98aa2; --sky: #7fa6c8; --leaf: #7fae7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --ink: #e9eaec; --muted: #7d828a; --line: #2a2d32;
  --pink: #d98aa2; --sky: #7fa6c8; --leaf: #7fae7a; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.65; }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
.mark { font-family: var(--display); font-weight: 500; font-size: 22px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
nav a { font-family: var(--mono); font-size: 13px; letter-spacing: 0.04em; color: var(--muted); text-decoration: none; }
nav a:hover, nav a[aria-current="page"] { color: var(--ink); }
nav { display: flex; align-items: center; gap: 18px; }
.ig { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; border-radius: 50%; color: var(--muted); transition: color .2s, background .2s, transform .2s; }
.ig-glyph { width: 16px; height: 16px; display: block; background: currentColor; -webkit-mask: url(/instagram.png) center / contain no-repeat; mask: url(/instagram.png) center / contain no-repeat; }
.ig:hover, .ig:focus-visible { color: var(--ink); background: var(--line); transform: translateY(-2px) rotate(-6deg); }
.ig:active { transform: translateY(0) scale(.92); }
a:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; border-radius: 2px; }

/* home */
.hero { display: flex; justify-content: center; margin-top: clamp(64px, 14vw, 140px); }
.hero img { width: 100%; max-width: 480px; height: auto; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* about: a dictionary entry */
.entry { margin-top: 72px; max-width: 34em; font-family: "Noto Serif JP", var(--body); }
.entry .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.entry h1 { font-family: "Noto Serif JP", var(--display); font-weight: 600; font-size: clamp(34px, 7vw, 46px); letter-spacing: .04em; margin: 0; line-height: 1.2; }
.entry .yomi { font-size: 16px; color: var(--muted); }
.entry .yomi span { font-family: var(--mono); font-size: 13px; letter-spacing: .04em; margin-left: 6px; }
.entry .etym { margin: 14px 0 22px; font-size: 14px; color: var(--muted); }
.entry ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: 17px; line-height: 1.8; }
.entry li { display: grid; grid-template-columns: 2em 1fr; }
.entry li b { font-weight: 600; color: var(--muted); }
.entry .tag { font-size: 13px; border: 1px solid var(--line); padding: 0 5px; margin-right: 4px; border-radius: 3px; color: var(--muted); }
.counter { display: flex; justify-content: center; align-items: flex-end; gap: 3px; margin-top: 72px; min-height: 100px; }
.counter img { height: 100px; width: 45px; image-rendering: pixelated; }

/* blog */
.list { list-style: none; padding: 0; margin: 72px 0 0; display: grid; gap: 4px; }
.list a { display: flex; gap: 20px; align-items: baseline; padding: 10px 0; color: var(--ink); text-decoration: none; }
.list a:hover .t { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 4px; }
.date { font-family: var(--mono); font-size: 13px; color: var(--muted); flex: 0 0 88px; font-variant-numeric: tabular-nums; }
.t { min-width: 0; }

article { max-width: 62ch; margin-top: 72px; }
article h1 { font-family: var(--display); font-weight: 300; font-size: clamp(30px, 6vw, 40px); line-height: 1.15; letter-spacing: -0.02em; margin: 6px 0 28px; text-wrap: balance; }
article p { margin: 0 0 1.1em; }
.back { display: inline-block; margin-top: 40px; font-family: var(--mono); font-size: 13px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--ink); }

.pic { margin: 0 0 1.4em; }
.pic img { display: block; width: 100%; height: auto; border-radius: 3px; }
.empty { margin-top: 72px; color: var(--muted); font-style: italic; }

/* desk buddy (bottom-right sprite) */
.buddy { position: fixed; right: calc(26px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 92px; z-index: 5; }
.buddy button { display: block; padding: 0; border: 0; background: none; cursor: pointer; width: 100%; -webkit-tap-highlight-color: transparent; }
.buddy button:focus-visible { outline: 2px solid var(--sky); outline-offset: 4px; border-radius: 8px; }
.buddy img { display: block; width: 100%; height: auto; transform-origin: 50% 100%; animation: idle 3.2s ease-in-out infinite; user-select: none; -webkit-user-drag: none; }
.buddy .body { transform-origin: 50% 100%; transition: transform .25s ease; }
.buddy.peek .body { transform: rotate(-4deg); }
.buddy.hop .body { animation: hop .42s cubic-bezier(.3,.7,.4,1); }
.buddy.bounce .body { animation: bounce .9s cubic-bezier(.3,.7,.4,1); }
.heart { position: fixed; z-index: 6; pointer-events: none; color: var(--pink); font-size: 18px; animation: float 1.3s ease-out forwards; }
@keyframes idle { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,.985); } }
@keyframes hop { 0% { transform: translateY(0) scale(1,1); } 20% { transform: translateY(0) scale(1.06,.92); } 55% { transform: translateY(-18px) scale(.97,1.04); } 100% { transform: translateY(0) scale(1,1); } }
@keyframes bounce { 0% { transform: translateY(0); } 15% { transform: translateY(0) scale(1.08,.9); } 40% { transform: translateY(-34px) scale(.96,1.05); } 60% { transform: translateY(0) scale(1.06,.94); } 78% { transform: translateY(-12px); } 100% { transform: translateY(0); } }
@keyframes float { 0% { opacity: 0; transform: translate(0,0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -70px) scale(1.1); } }
@media (max-width: 520px) { .buddy { width: 72px; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); } .wrap { padding-bottom: 130px; } }
@media (prefers-reduced-motion: reduce) { .buddy img, .buddy .body, .heart { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="mark" href="#home">zuu</a>
    <nav><a href="#about" id="navabout">about</a><a href="#posts" id="navblog">posts</a><a class="ig" href="https://www.instagram.com/yizuai/" target="_blank" rel="noopener" aria-label="instagram" title="instagram"><span class="ig-glyph" aria-hidden="true"></span></a></nav>
  </header>

  <main id="home">
    <div class="hero"><img src="hero.gif" alt="" width="640" height="376"></div>
  </main>

  <main id="blog" hidden>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty" hidden>Nothing here yet.</p>
  </main>

  <main id="about" hidden>
    <div class="entry" lang="ja">
      <div class="head"><h1>yanderu</h1><div class="yomi">やんでる<span>yanderu</span></div></div>
      <p class="etym">〔動詞「病む」＋「いる」の口語形「〜でる」〕</p>
      <ol>
        <li><b>一</b><span>病気にかかっている。体が弱っている。</span></li>
        <li><b>二</b><span>心が疲れて不安定になっている。精神的にまいっている。</span></li>
        <li><b>三</b><span><span class="tag">俗</span>思いつめすぎて、考え方や行動が普通ではなくなっている様子。「あの子、ちょっと―よね」</span></li>
      </ol>
    </div>
    <div class="counter" id="counter" role="img"></div>
  </main>

  <main id="post" hidden>
    <article>
      <div class="date" id="pdate"></div>
      <h1 id="ptitle"></h1>
      <div id="pbody"></div>
    </article>
    <a class="back" href="#posts">&larr; all posts</a>
  </main>
</div>

<div class="buddy" id="buddy">
  <div class="body"><button type="button" id="buddybtn" aria-label="poke"><img src="/sprite.png" alt="" width="244" height="320"></button></div>
</div>

<!-- Posts: newest first is not required; the page sorts by date. -->
<script type="application/json" id="posts-data">[{"slug": "hmmt-26", "date": "2026-11-08", "title": "hmmt 26+", "body": "it was really fun\nstill waiting for results to come out but probably didnt get top 50 cause of theme p9 (19, 36, 10)\nour flight got delayed 3 times but thats not a problem cause we just met with toan played ping pong and went to harvard square\nim still sad i didnt get the hrt plushie but its ok cause i got so much other stuff anyways\nhmmt is always a nice palate cleanser\n\ngot home from the airport at 2 am yesterday and took my stripe oa before going to bed\nthankfully it was only 1 question and i passed all test cases so now i have to prep for interview and write questionare essays\n3 months in seattle for $60 an hour sounds great so im doing this for u benji"}, {"slug": "over-10-days", "date": "2026-11-04", "title": "wwwewwewe", "body": "11/5 - amc 10a\n11/6, 11/7 - hmmt\n11/8 - calico\n11/10 - stripe oa\n11/12 - stripe r1 interview\n11/13 - amc 10b\n11/14 - mmaths"}, {"slug": "cant-stop-wont-stop", "date": "2026-11-04", "title": "can't stop won't stop", "body": "#_x"}]</script>
<script>
let POSTS = [];
try { POSTS = JSON.parse(document.getElementById("posts-data").textContent) || []; } catch (e) {}
POSTS.sort((a, b) => b.date.localeCompare(a.date));

const $ = (id) => document.getElementById(id);
const fmt = (d) => d.replaceAll("-", ".");
const esc = (t) => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const IMG = /^\[image: ((?:\/|https:\/\/)[^\s"<>\]]+)\]$/;
const paras = (t) => t.trim().split(/\n\s*\n/).map(p => {
  const m = p.trim().match(IMG);
  if (m) return `<figure class="pic"><img src="${esc(m[1])}" alt="" loading="lazy"></figure>`;
  return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>";
}).join("");

function renderList() {
  $("list").innerHTML = POSTS.map(p =>
    `<li><a href="#p-${esc(p.slug)}"><span class="date">${fmt(p.date)}</span><span class="t">${esc(p.title)}</span></a></li>`).join("");
  $("empty").hidden = POSTS.length > 0;
}

function route() {
  let h = location.hash.slice(1) || "home";
  if (h === "posts") h = "blog";
  const post = h.startsWith("p-") && POSTS.find(p => "p-" + p.slug === h);
  $("home").hidden = !(h === "home" || (!post && h !== "blog" && h !== "about"));
  $("blog").hidden = h !== "blog";
  $("about").hidden = h !== "about";
  $("post").hidden = !post;
  if (post) { $("pdate").textContent = fmt(post.date); $("ptitle").textContent = post.title; $("pbody").innerHTML = paras(post.body); }
  if (h === "blog" || post) $("navblog").setAttribute("aria-current", "page"); else $("navblog").removeAttribute("aria-current");
  if (h === "about") $("navabout").setAttribute("aria-current", "page"); else $("navabout").removeAttribute("aria-current");
  window.scrollTo(0, 0);
}
renderList();
addEventListener("hashchange", route);
route();


// day counter: 5752 on 2026-11-08 (New York time), +1 each day, shown with one leading zero
(() => {
  const ny = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const [y, m, d] = ny.split("-").map(Number);
  const days = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2026, 10, 8)) / 86400000);
  const text = "0" + (5752 + Math.max(0, days));
  const el = $("counter");
  el.setAttribute("aria-label", text);
  el.innerHTML = [...text].map(c => `<img src="/counter/${c}.gif" alt="" width="45" height="100">`).join("");
})();

// desk buddy: hops when you click links/buttons, leans when you hover one, bounces + hearts when poked
(() => {
  const b = $("buddy"), btn = $("buddybtn");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  function play(cls) { b.classList.remove("hop", "bounce"); void b.offsetWidth; b.classList.add(cls); }
  b.addEventListener("animationend", (e) => { if (e.target.classList.contains("body")) b.classList.remove("hop", "bounce"); });
  function hearts(n) {
    if (still.matches) return;
    const r = btn.getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const h = document.createElement("span");
      h.className = "heart"; h.textContent = "♥";
      h.style.left = (r.left + r.width * (0.2 + Math.random() * 0.6)) + "px";
      h.style.top = (r.top + r.height * 0.25) + "px";
      h.style.setProperty("--dx", (Math.random() * 50 - 25) + "px");
      h.style.animationDelay = (i * 0.12) + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1600 + i * 120);
    }
  }
  btn.addEventListener("click", (e) => { e.stopPropagation(); play("bounce"); hearts(3); });
  document.addEventListener("click", (e) => { if (e.target.closest("a, button, input, label, summary, [role=button]")) play("hop"); });
  document.addEventListener("pointerover", (e) => { if (e.target.closest("a, button")) b.classList.add("peek"); });
  document.addEventListener("pointerout", (e) => { if (e.target.closest("a, button")) b.classList.remove("peek"); });
})();
</script>
</body>
</html>
